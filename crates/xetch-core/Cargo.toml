[package]
name = "xetch-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
validation-hooks = ["windows-sys/Win32_Storage_FileSystem", "windows-sys/Win32_Storage_Vhd", "windows-sys/Win32_System_IO", "windows-sys/Win32_System_Ioctl"]

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
sha2.workspace = true
crc32fast.workspace = true
fatfs.workspace = true
fstool.workspace = true
tempfile.workspace = true
uuid.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Threading", "Win32_System_JobObjects", "Win32_System_Diagnostics_ToolHelp"] }

[[example]]
name = "device_validation_probe"
required-features = ["validation-hooks"]
