[package]
name = "xetch-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "xetch"
path = "src/main.rs"

[dependencies]
xetch-core = { path = "../xetch-core" }
clap.workspace = true
serde_json.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_Security"] }

[dev-dependencies]
tempfile.workspace = true
