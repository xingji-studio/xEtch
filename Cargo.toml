[workspace]
members = ["crates/xetch-core", "crates/xetch-cli"]
exclude = ["vendor/fstool", "vendor/fatfs"]
resolver = "2"

[patch.crates-io]
fstool = { path = "vendor/fstool" }
fatfs = { path = "vendor/fatfs" }

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
license = "Apache-2.0"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2"
sha2 = "0.10"
crc32fast = "1.5"
fatfs = { version = "0.3.6", default-features = false, features = ["std", "alloc"] }
fstool = { version = "=0.5.0", default-features = false, features = ["std", "exfat", "ext", "ntfs"] }
tempfile = "3"
clap = { version = "4.5", features = ["derive"] }
uuid = { version = "1", features = ["v4"] }
